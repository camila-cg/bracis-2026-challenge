[project]
name = "bracis-2026-challenge"
version = "0.1.0"
description = "Verificação de citações jurídicas em pareceres de IA (Jusbrasil × BRACIS 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # usados pela métrica oficial (data/kaggle_metric.py)
    "pandas",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# notebooks de EDA em src/*.ipynb
notebooks = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
]
ml = [
    "torch>=2.2,<3",
    "transformers>=4.45,<5",
    "peft>=0.13,<1",
    "accelerate>=1,<2",
    "numpy>=1.26,<3",
]
llm = [
    "torch>=2.2,<3",
    "transformers>=4.45,<5",
    "accelerate>=1,<2",
    "bitsandbytes>=0.43,<1",
]

[tool.uv]
package = false
default-groups = ["notebooks"]
