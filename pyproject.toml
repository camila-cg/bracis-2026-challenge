[project]
name = "bracis-2026-challenge"
version = "0.1.0"
description = "Verificação de citações jurídicas em pareceres de IA (Jusbrasil × BRACIS 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # usados pela métrica oficial (data/kaggle_metric.py)
    "pandas",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# notebooks de análise em notebooks/*.ipynb
notebooks = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
]
ml = [
    "torch>=2.2,<3",
    "transformers>=4.45,<5",
    "peft>=0.13,<1",
    "accelerate>=1,<2",
    "numpy>=1.26,<3",
]
llm = [
    "torch>=2.2,<3",
    "transformers>=4.45,<5",
    "accelerate>=1,<2",
    "bitsandbytes>=0.43,<1",
]

[tool.uv]
package = false
default-groups = ["dev", "notebooks"]

[tool.uv.sources]
# PyPI publica apenas a wheel CPU do torch no Windows. A origem explícita evita
# que uma máquina NVIDIA pareça configurada corretamente, mas treine na CPU.
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
